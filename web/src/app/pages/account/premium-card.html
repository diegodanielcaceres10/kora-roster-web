<ui-card accent="primary">
  <div card-header class="flex items-center gap-3">
    <span
      class="inline-flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary/15 text-xl text-amber-700 dark:text-primary"
    >
      <ui-icon name="lock" />
    </span>
    <h2 class="font-display text-base font-black uppercase tracking-tight text-ink">
      {{ t().title }}
    </h2>
  </div>

  <div class="space-y-3">
    <p class="text-sm font-medium text-ink-muted">{{ t().intro }}</p>
    <ul class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      @for (item of items(); track item) {
        <li>
          <button
            type="button"
            aria-disabled="true"
            class="flex w-full items-center gap-2.5 rounded-xl border border-line bg-surface-muted/60 px-3 py-2.5 text-left text-sm font-medium text-ink transition hover:border-ink/20 hover:bg-ink/5 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
            (click)="touch()"
          >
            <ui-icon name="lock" class="shrink-0 text-xs text-ink-faint" />
            <span>{{ item }}</span>
          </button>
        </li>
      }
    </ul>
    <app-lock-notice [reason]="notice() ? 'premium' : null" [message]="notice()" />
  </div>
</ui-card>
