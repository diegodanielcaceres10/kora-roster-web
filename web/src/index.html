<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kora Roster</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <script>
      // Puts the saved theme on the page before it is painted, so a dark visit does not flash
      // white. Keep the key equal to THEME_STORAGE_KEY in theme/theme.ts, and the rule for a
      // first visit equal to Theme's (light for now).
      (function () {
        try {
          if (localStorage.getItem('kora:theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
