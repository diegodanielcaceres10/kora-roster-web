<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kora Roster</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <script>
      // Puts the theme on the page before it is painted, so a dark visit does not flash white.
      // Keep the key equal to THEME_STORAGE_KEY in theme/theme.ts and the rule equal to Theme's:
      // the saved choice wins, and without one the system preference decides.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('kora:theme');
        } catch (e) {}
        var dark = saved === 'dark';
        if (saved !== 'dark' && saved !== 'light') {
          try {
            dark = !!(
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            );
          } catch (e) {}
        }
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
